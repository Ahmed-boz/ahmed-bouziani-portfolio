<svg viewBox="0 0 420 470" role="img">
      <title>Topologie de mon labo</title>
      <defs>
        <path id="l-inet" d="M210 92 L210 142"></path>
        <path id="l-sw" d="M210 196 L210 246"></path>
        <path id="l-ad" d="M210 290 L60 360"></path>
        <path id="l-web" d="M210 290 L160 360"></path>
        <path id="l-glpi" d="M210 290 L260 360"></path>
        <path id="l-pc" d="M210 290 L360 360"></path>
      </defs>

      <g class="liens">
        <use href="#l-inet"></use><use href="#l-sw"></use><use href="#l-ad"></use><use href="#l-web"></use><use href="#l-glpi"></use><use href="#l-pc"></use>
      </g>

      <!-- Internet -->
      <g class="equipement">
        <path class="nuage" d="M150 78 a26 26 0 0 1 10-46 a34 34 0 0 1 62-12 a26 26 0 0 1 46 16 a22 22 0 0 1 2 42 z"></path>
        <text x="210" y="62" class="etiquette-topo">Internet</text>
      </g>

      <!-- Routeur / pare-feu -->
      <g class="equipement">
        <rect x="150" y="142" width="120" height="54" rx="8"></rect>
        <circle cx="168" cy="160" r="3.5" class="led-topo activite"></circle>
        <text x="216" y="166" class="nom-topo">R1</text>
        <text x="216" y="184" class="ip-topo">routeur · pare-feu</text>
      </g>

      <!-- Switch -->
      <g class="equipement">
        <rect x="130" y="246" width="160" height="44" rx="6"></rect>
        <g class="mini-ports">
          <rect x="146" y="258" width="12" height="9"></rect><rect x="164" y="258" width="12" height="9"></rect><rect x="182" y="258" width="12" height="9"></rect><rect x="200" y="258" width="12" height="9"></rect><rect x="218" y="258" width="12" height="9"></rect><rect x="236" y="258" width="12" height="9"></rect>
        </g>
        <text x="210" y="282" class="ip-topo">SW1 · VLAN 10</text>
      </g>

      <!-- Serveurs et postes -->
      <g class="equipement">
        <rect x="22" y="360" width="76" height="62" rx="6"></rect>
        <line x1="32" y1="376" x2="88" y2="376"></line><line x1="32" y1="388" x2="88" y2="388"></line>
        <circle cx="82" cy="398" r="2.6" class="activite"></circle>
        <text x="60" y="410" class="nom-topo">SRV-AD</text>
        <text x="60" y="440" class="ip-topo">.10.10</text>
      </g>
      <g class="equipement">
        <rect x="122" y="360" width="76" height="62" rx="6"></rect>
        <line x1="132" y1="376" x2="188" y2="376"></line><line x1="132" y1="388" x2="188" y2="388"></line>
        <circle cx="182" cy="398" r="2.6" class="activite"></circle>
        <text x="160" y="410" class="nom-topo">SRV-WEB</text>
        <text x="160" y="440" class="ip-topo">.10.20</text>
      </g>
      <g class="equipement">
        <rect x="222" y="360" width="76" height="62" rx="6"></rect>
        <line x1="232" y1="376" x2="288" y2="376"></line><line x1="232" y1="388" x2="288" y2="388"></line>
        <circle cx="282" cy="398" r="2.6" class="activite"></circle>
        <text x="260" y="410" class="nom-topo">GLPI</text>
        <text x="260" y="440" class="ip-topo">.10.30</text>
      </g>
      <g class="equipement">
        <rect x="324" y="360" width="72" height="46" rx="5"></rect>
        <rect x="346" y="406" width="28" height="8" rx="2"></rect>
        <circle cx="386" cy="370" r="2.6" class="activite"></circle>
        <text x="360" y="388" class="nom-topo">PC</text>
        <text x="360" y="440" class="ip-topo">DHCP</text>
      </g>
      <text x="210" y="464" class="legende-topo">192.168.10.0/24</text>

      <!-- Paquets -->
      <g class="paquets">
        <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l-inet"></mpath></animateMotion></circle>
        <circle r="4"><animateMotion dur="2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#l-sw"></mpath></animateMotion></circle>
        <circle r="4"><animateMotion dur="2.6s" begin="-0.3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l-ad"></mpath></animateMotion></circle>
        <circle r="4"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#l-web"></mpath></animateMotion></circle>
        <circle r="4" class="cyan"><animateMotion dur="2.8s" begin="-0.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l-glpi"></mpath></animateMotion></circle>
        <circle r="4" class="cyan"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l-pc"></mpath></animateMotion></circle>
      </g>
    </svg>